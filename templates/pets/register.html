{% extends 'base.html' %}

{% block title %}注册 - 宠物生病管理系统{% endblock %}

{% block body %}
<div class="login-box">
    <h1>用户注册</h1>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-row">
                <label>{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button class="btn" type="submit">注 册</button>
            <a class="btn btn-gray" href="{% url 'login' %}">返回登录</a>
        </div>
    </form>
</div>
{% endblock %}
